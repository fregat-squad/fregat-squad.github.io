<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FREGAT SQUAD из Кирово-Чепецка. Слушай треки, листай колоду и заходи к нам.">
  <title>FREGAT SQUAD</title>
  <link rel="icon" href="media/logo.jpg">
  <link rel="preload" as="image" href="media/steersman.png">
  <link rel="stylesheet" href="style.css">
  <script src="spectra.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <canvas class="dot-wave" aria-hidden="true"></canvas>
  <div class="dot-light" aria-hidden="true"></div>
  <div class="shell">
    <header class="masthead">
      <a class="city" href="https://yandex.ru/maps/org/fregat/206045547952/?ll=50.057565%2C58.547679&amp;z=14" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 10-8 10S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Кирово-Чепецк
      </a>
    </header>
    <main>
      <div class="hero">
        <section class="intro" aria-labelledby="title">
          <img class="squad-logo" src="media/logo.jpg" width="148" height="148" alt="Логотип FREGAT SQUAD">
          <h1 id="title"><span>FREGAT</span><span>SQUAD</span></h1>
          <nav class="socials" aria-label="Ссылки сквада">
            <a href="https://discord.gg/5tpP6APnrq" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M19.8 5.4a18 18 0 0 0-4.5-1.4l-.6 1.2a17 17 0 0 0-5.4 0L8.7 4a18 18 0 0 0-4.5 1.4C1.4 9.5.6 13.5 1 17.4a18 18 0 0 0 5.5 2.7l1.2-1.9-1.8-.9.4-.3a13.6 13.6 0 0 0 11.4 0l.4.3-1.8.9 1.2 1.9a18 18 0 0 0 5.5-2.7c.5-4.5-.8-8.5-3.2-12Zm-11 9.5c-1 0-1.7-.9-1.7-1.9 0-1.1.7-1.9 1.7-1.9s1.8.8 1.8 1.9c0 1-.8 1.9-1.8 1.9Zm6.4 0c-1 0-1.8-.9-1.8-1.9 0-1.1.8-1.9 1.8-1.9s1.7.8 1.7 1.9c0 1-.7 1.9-1.7 1.9Z"/></svg>Discord</a>
            <a href="https://soundcloud.com/anonymousfregatclub" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13v3m3-5v5m3-7v7m3-8v8m3-9.5V16h5a3 3 0 1 0-1.1-5.8A4.5 4.5 0 0 0 14 6.5Z"/></svg>SoundCloud</a>
            <a href="https://t.me/fregatsquad" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 4-3.6 16-5.5-4.2-3 2.8.5-4.7L18 7.3l-10.6 5-4.8-1.5L21 4Z"/></svg>Telegram</a>
            <a href="https://yandex.ru/maps/org/fregat/206045547952/?ll=50.057565%2C58.547679&amp;z=14" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 10-8 10S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Кафе «Фрегат»</a>
          </nav>
        </section>
        <section class="gallery" aria-label="Колода сквада">
          <button class="deck" type="button" aria-label="Показать следующую карту">
            <span class="card" data-depth="0"><img src="media/pitabaik1.gif" alt="Питбайк на закате"></span>
            <span class="card" data-depth="1" aria-hidden="true"><img src="media/pitbaik2.gif" alt="Питбайк, второй кадр"></span>
            <span class="card" data-depth="2" aria-hidden="true"><img src="media/pitbaik3.gif" alt="Питбайк, третий кадр"></span>
            <span class="card" data-depth="3" aria-hidden="true"><img src="media/surprise.jpg" alt="Сюрприз"></span>
          </button>
        </section>
      </div>
      <section class="player" aria-label="Музыка FREGAT SQUAD">
        <audio id="audio" src="media/music/00_pampam.mp3" preload="metadata"></audio>
        <div class="track">
          <img class="track-logo" src="media/logo.jpg" width="48" height="48" alt="">
          <div class="track-copy">
            <button class="track-toggle" id="track-toggle" type="button" aria-label="Выбрать трек" aria-describedby="track-title" aria-expanded="false" aria-controls="playlist">
              <span class="track-labels">
                <span id="player-status" aria-live="polite"></span>
                <strong id="track-title">пампАмпАм</strong>
              </span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <ol class="player-panel playlist" id="playlist" aria-label="Треки сквада" inert>
              <li><button type="button" data-file="00_pampam.mp3" aria-current="true">пампАмпАм</button></li>
              <li><button type="button" data-file="01_pitbaik.m4a">Питбайк</button></li>
              <li><button type="button" data-file="06_radio_fregat_fm.m4a">Радио Фрегат FM</button></li>
              <li><button type="button" data-file="02_nasha_poslednyaya_ssora.m4a">Наша последняя ссора</button></li>
              <li><button type="button" data-file="03_grustnyi_trek_pro_lyubov.m4a">Грустный трек про любовь</button></li>
              <li><button type="button" data-file="04_freddie_krueger.m4a">Фредди Крюгер</button></li>
              <li><button type="button" data-file="05_yutub_2015.m4a">Ютуб 2015</button></li>
              <li><button type="button" data-file="07_zapakh_mertvyachiny.m4a">Запах мертвячины</button></li>
            </ol>
          </div>
        </div>
        <div class="controls">
          <button id="previous" type="button" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m12-13-9 6 9 6Z"/></svg></button>
          <button id="play" type="button" aria-label="Воспроизвести"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-shape" d="m9 5 11 7-11 7Z"/><path class="pause-shape" d="M9 5v14m6-14v14"/></svg></button>
          <button id="next" type="button" aria-label="Следующий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6Z"/></svg></button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Позиция в треке" disabled>
          <span id="duration">0:00</span>
        </div>
        <div class="sound">
          <button id="sound-toggle" type="button" aria-label="Настройки громкости" aria-expanded="false" aria-controls="sound-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path class="sound-waves" d="M16 9a5 5 0 0 1 0 6m2-8a8 8 0 0 1 0 10"/><path class="sound-muted" d="m16 10 5 5m0-5-5 5"/></svg>
          </button>
          <div class="player-panel sound-panel" id="sound-panel" inert>
            <label for="volume">Громкость</label>
            <output id="volume-value" for="volume">16%</output>
            <input id="volume" type="range" min="0" max="100" value="16">
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="equalizer" aria-hidden="true"><canvas id="equalizer"></canvas></div>
  <button class="bottle-button" type="button" aria-label="Запустить бутылки Steersman" title="Steersman">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4v5l3 3v8.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19.5V11l3-3Zm-3 10h10m-10 4h10"/></svg>
  </button>
  <div class="bottle-layer" aria-hidden="true"></div>
  <template id="bottle-template">
    <span class="falling-bottle"><img src="media/steersman.png" width="447" height="447" alt=""></span>
  </template>
</body>
</html>
